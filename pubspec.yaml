name: yp_flutter_recruitment_demo
description: "A pure Flutter layered architecture demo for a recruitment app."
# 防止当前 demo 被误发布到 pub.dev；私有项目建议保留该配置。
publish_to: 'none' # 如果后续要发布到 pub.dev，可以删除这一行。

# 这里定义应用展示版本号和构建号。
# `+` 前面的部分会作为展示版本号，`+` 后面的部分会作为构建号。
# Flutter 构建时也可以通过 `--build-name` 和 `--build-number` 覆盖。
# Android 中 build-name 对应 versionName，build-number 对应 versionCode。
# Android 版本配置说明：https://developer.android.com/studio/publish/versioning
# iOS 中 build-name 对应 CFBundleShortVersionString，build-number 对应 CFBundleVersion。
# iOS 版本配置说明：
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# Windows 中 build-name 对应产品和文件版本的主版本、次版本、补丁版本，build-number 作为构建后缀。
version: 1.0.0+1

environment:
  sdk: ^3.7.0

# dependencies 声明应用运行所需的三方依赖。
# 如需查看依赖是否有新版本，可以运行 `flutter pub outdated`。
# 如需大版本升级，可以运行 `flutter pub upgrade --major-versions` 后再验证兼容性。
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_bloc: ^9.1.1
  go_router: ^14.8.1
  bot_toast: ^4.1.3
  json_annotation: 4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # flutter_lints 提供 Flutter 推荐的静态检查规则，具体启用和关闭项在 analysis_options.yaml 中维护。
  flutter_lints: ^5.0.0
  build_runner: 2.5.4
  json_serializable: 6.9.5

# Dart pubspec 通用配置说明：https://dart.dev/tools/pub/pubspec

# 以下为 Flutter 应用专用配置。
flutter:

  # 引入 Material Icons 字体，便于直接使用 Flutter 内置的 Material 图标。
  uses-material-design: true

  # 如需添加图片、JSON 等资源，可以增加 assets 配置，例如：
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # 图片资源可以提供多倍率变体，说明见：
  # https://flutter.dev/to/resolution-aware-images

  # 如需使用依赖包中的资源，说明见：
  # https://flutter.dev/to/asset-from-package

  # 如需添加自定义字体，可以在 flutter 节点下增加 fonts 配置，例如：
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # 如需使用依赖包中的字体，说明见：https://flutter.dev/to/font-from-package
