# 该文件配置 Dart analyzer，用于静态检查错误、警告和 lint 规则。
#
# analyzer 发现的问题会展示在支持 Dart 的 IDE 中，也可以通过 `flutter analyze` 手动执行。

# 启用 Flutter 官方推荐 lint 规则，作为 demo 的基础代码规范。
include: package:flutter_lints/flutter.yaml

linter:
  # 可以在下面的 rules 中关闭默认规则或启用额外规则。
  # 全部 lint 规则说明见：https://dart.dev/lints
  #
  # 如果只想局部忽略某条规则，可以使用 `// ignore: name_of_lint`
  # 或 `// ignore_for_file: name_of_lint`。
  rules:
    # avoid_print: false  # 取消注释可关闭 `avoid_print` 规则。
    # prefer_single_quotes: true  # 取消注释可启用 `prefer_single_quotes` 规则。

# 更多 analyzer 配置说明：https://dart.dev/guides/language/analysis-options
